<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="initial-scale=1, width=device-width"/>
<title>Tienda</title>
<link rel="icon" type="image/x-icon" href="candel_alice_logo.ico">
<style>

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap');

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: "Quicksand", sans-serif;
}

header {
position: relative;
height: 100vh;
overflow: hidden;
}

header::before, header::after, header .layer-3 {
content: "";
position: absolute;
inset: 0;
background-size: cover;
background-position: center;
opacity: 0;
z-index: -1;
animation-duration: 12s;
animation-timing-function: ease-in-out;
animation-iteration-count: infinite;
}

header::before {
background-image: url("fondo_header_1.png");
animation-name: fade1;
}

header::after {
background-image: url("fondo_header_2.png");
animation-name: fade2;
}

header .layer-3 {
background-image: url("fondo_header_3.png");
animation-name: fade3;
}

@keyframes fade1 {
  0%, 33% { opacity: 1; }
  33%, 66% { opacity: 0; }
  66%, 100% { opacity: 1; }
}

@keyframes fade2 {
  0%, 33% { opacity: 0; }
  33%, 66% { opacity: 1; }
  66%, 100% { opacity: 0; }
}

@keyframes fade3 {
  0%, 66% { opacity: 0; }
  66%, 90% { opacity: 1; }
  90%, 100% { opacity: 0; }
}

header nav ul {
list-style: none;
position: fixed;
width: 100%;
height: 50px;
background-color: rgba(255, 255, 255, 0.5);
display: flex;
justify-content: space-around;
align-items: center;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
z-index: 1;
}

header nav ul li a {
font-weight: 500;
font-size: 1.2em;
color: #000;
text-decoration: none;
transition: 300ms;
}

header nav ul li a:hover {
text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

header .logo-title-cont {
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-evenly;
}

header .logo-title-cont .logo img {
height: 200px;
width: 200px;
border-radius: 50%;
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
}

header .logo-title-cont .logo h1 {
text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.5);
}

header .logo-title-cont a .title {
background-color: rgba(254, 100, 208, 0.75);
border-radius: 50px;
padding: 15px;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
animation: floatY 3s ease-in-out infinite;
}

@keyframes floatY {
	0% { transform: translateY(0px); }
	50% { transform: translateY(-5px); }
	100% { transform: translateY(0px); }
}

header .logo-title-cont a {
text-decoration: none;
}

header .logo-title-cont a:hover .title {
background-color: rgba(254, 100, 208, 1);
text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.5);
}

header .logo-title-cont a .title h1 {
color: #fff;
font-size: 2em;
}

main .candel-creator {
position: relative;
background:
    linear-gradient(
      rgb(255, 255, 255),
      rgba(255, 255, 255, 0.3),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.3),
      rgb(255, 255, 255)
    ),
    url("fondo_shop.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

main .candel-creator div {
margin: 10px 0px;
}

main .candel-creator div ul {
background: rgba(255, 255, 255, 0.5);
padding: 10px 0px;
box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
list-style: none;
display: grid;
grid-template-rows: repeat(2, 100px);
row-gap: 5px;
grid-template-columns: repeat(4, 1fr);
justify-items: center;
}

main .candel-creator div ul li button {
background: #fff;
cursor: pointer;
padding: 2px;
width: 75px;
border-radius: 5px;
border: none;
box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

main .candel-creator .candel-receptacle ul li .selected {
position: relative;
border: 4px inset lightgreen;
}

main .candel-creator .candel-receptacle ul li .selected::after {
content: '✔';
position: absolute;
color: green;
top: 0;
right: 2px;
}

main .candel-creator .candel-fragrance ul li .selected {
position: relative;
border: 4px inset lightgreen;
}

main .candel-creator .candel-fragrance ul li .selected::after {
content: '✔';
position: absolute;
color: green;
top: 0;
right: 2px;
}

main .candel-creator div ul li button img {
height: 50px;
width: 50px;
border-radius: 50px;
}

main .candel-creator .candel-mod {
overflow-y: scroll;
margin: 0px;
position: sticky;
bottom: 0;
width: 100%;
height: 100px;
background-color: rgba(255, 255, 255, 0.3);
display: flex;
justify-content: space-between;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
z-index: 1;
}

main .candel-creator .candel-mod #candel-show {
display: flex;
gap: 25px;
position: relative;
margin: 0px;
padding-left: 5px;
}

main .candel-creator .candel-mod #candel-show p {
margin: auto;
font-size: 12px;
}
main .candel-creator .candel-mod #candel-show b {
position: absolute;
bottom: 5px;
left: 5px;
font-size: 14px;
}

main .candel-creator .candel-mod #candel-show div b, main .candel-creator .candel-mod #candel-show div p {
left: 0;
position: relative;
font-size: 12px;
}

main .candel-creator .candel-mod .cart-buttons {
margin: 0;
position: absolute;
display: flex;
flex-direction: column;
gap: 5px;
right: 10px;
top: 5px;
}

main .candel-creator .candel-mod .cart-buttons button {
padding: 2px;
border: 1px solid green;
border-radius: 5px;
color: white;
background: lightgreen;
box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
}

main .candel-creator .candel-mod .cart-buttons ion-icon {
height: 20px;
width: 20px;
}

main .candel-creator .candel-mod .cart-buttons p {
font-size: 10px;
}

</style>
</head>
<body>

<header>
	<nav>
		<ul>
			<li><a href="index.html">Inicio</a></li>
			<li><a href="products.html">Productos</a></li>
			<li><a href="about.html">Descúbrenos</a></li>
			<li><a href="contact.html">Contacto</a></li>
		</ul>
	</nav>
	
	<div class="logo-title-cont">

		<div class="logo">
			<img src="candel_alice_logo.jpg"/>
			<h1>Candel_Alice</h1>
		</div>

		<a href="shop.html">
			<div class="title">
				<h1>REALIZAR PEDIDO</h1>
			</div>
		</a>

	</div>

	<div class="layer-3"></div>


</header>

<main>

	<section class="candel-creator">

		<div class="candel-receptacle">
			<ul>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Rectangulo 100ml</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Cuadrado 100ml</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Circulo 100ml</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Cilindro 100ml</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Rectangulo 200ml</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Cuadrado 200ml</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Circulo 200ml</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Cilindro 200ml</p></button></li>
			</ul>
		</div>

		<div class="candel-fragrance">
			<ul>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Árbol de pino</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Lima fresca</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Mango Algarroba</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Frutos rojos</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Menta polar</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Cedro y ámbar</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Aceite de romero</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Árbol de te verde</p></button></li>
			</ul>
		</div>

		<div class="candel-mod">
			<div id="candel-show">

			</div>

			<div class="cart-buttons">
				<button><ion-icon name="bag-add-outline"></ion-icon><p>Añadir</p></button>
				<button><ion-icon name="cart-outline"></ion-icon><p>Pedido</p></button>
			</div>

		</div>

	</section>

	<section class="form">

		<form>
			<label for=""></label>
		</form>

	</section>

</main>

	<footer>

	</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const receptacleButtons = document.querySelectorAll(".candel-receptacle button");
    const fragranceButtons = document.querySelectorAll(".candel-fragrance button");

    const MAX_SELECTED = 3;

    // Estado
    let selectedReceptacle = null;
    let selectedFragrances = [];

    // Precios de ejemplo
    const receptaclePrices = {
        "Rectangulo 100ml": 12.5,
        "Cuadrado 100ml": 12.0,
        "Circulo 100ml": 11.5,
        "Cilindro 100ml": 11.0,
        "Rectangulo 200ml": 16.0,
        "Cuadrado 200ml": 15.5,
        "Circulo 200ml": 15.0,
        "Cilindro 200ml": 14.5
    };

    const fragrancePrices = {
        "Árbol de pino": 2.5,
        "Lima fresca": 2.0,
        "Mango Algarroba": 3.0,
        "Frutos rojos": 2.5,
        "Menta polar": 2.0,
        "Cedro y ámbar": 3.0,
        "Aceite de romero": 2.5,
        "Árbol de te verde": 2.5
    };

    const showContainer = document.getElementById("candel-show");

    // Recipientes (selección única)
    receptacleButtons.forEach(button => {
        button.addEventListener("click", () => {
            receptacleButtons.forEach(b => b.classList.remove("selected"));
            button.classList.add("selected");

            const text = button.querySelector("p").textContent.trim();

            selectedReceptacle = {
                name: text,
                price: receptaclePrices[text] || 0
            };

            buildOrderObject();
        });
    });

    // Fragancias (máx. 3)
    fragranceButtons.forEach(button => {
        button.addEventListener("click", () => {
            const text = button.querySelector("p").textContent.trim();

            if (button.classList.contains("selected")) {
                button.classList.remove("selected");
                selectedFragrances = selectedFragrances.filter(
                    f => f.name !== text
                );
                buildOrderObject();
                return;
            }

            if (selectedFragrances.length >= MAX_SELECTED) {
                return;
            }

            button.classList.add("selected");
            selectedFragrances.push({
                name: text,
                price: fragrancePrices[text] || 0
            });

            buildOrderObject();
        });
    });

    // Construcción del objeto final y actualización visual
    function buildOrderObject() {
        if (!selectedReceptacle) {
            showContainer.innerHTML = "<p>Selecciona un recipiente para comenzar</p>";
            return;
        }

        const total =
            selectedReceptacle.price +
            selectedFragrances.reduce((sum, f) => sum + f.price, 0);

        const order = {
            receptacle: selectedReceptacle,
            fragrances: selectedFragrances,
            total: Number(total.toFixed(2))
        };

        // Mostrar en el contenedor
        renderOrder(order);
        console.log("Pedido actual:", order);
    }

    function renderOrder(order) {
        let html = `<div><b>Recipiente</b><p>${order.receptacle.name}: </p><p style="text-align: center;">${order.receptacle.price.toFixed(2)}€</p></div>`;

        html += `<div><b>Fragancias</b>`;
        if (order.fragrances.length === 0) {
            html += `<p>Selecciona fragancias</p>`;
        } else {
            order.fragrances.forEach(f => {
                html += `<p>${f.name}: ${f.price.toFixed(2)}€</p>`;
            });
        }

        html += `</div>`;

        html += `<b>Total: ${order.total.toFixed(2)}€</b>`;

        showContainer.innerHTML = html;
    }
});

</script>

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
