<style>

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap');

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: "Quicksand", sans-serif;
}

header {
position: relative;
height: 100vh;
overflow: hidden;
}

header::before, header::after, header .layer-3 {
content: "";
position: absolute;
inset: 0;
background-size: cover;
background-position: center;
opacity: 0;
z-index: -1;
animation-duration: 12s;
animation-timing-function: ease-in-out;
animation-iteration-count: infinite;
}

header::before {
background-image: url("fondo_header_1.png");
animation-name: fade1;
}

header::after {
background-image: url("fondo_header_2.png");
animation-name: fade2;
}

header .layer-3 {
background-image: url("fondo_header_3.png");
animation-name: fade3;
}

@keyframes fade1 {
  0%, 33% { opacity: 1; }
  33%, 66% { opacity: 0; }
  66%, 100% { opacity: 1; }
}

@keyframes fade2 {
  0%, 33% { opacity: 0; }
  33%, 66% { opacity: 1; }
  66%, 100% { opacity: 0; }
}

@keyframes fade3 {
  0%, 66% { opacity: 0; }
  66%, 90% { opacity: 1; }
  90%, 100% { opacity: 0; }
}

header nav ul {
list-style: none;
position: fixed;
width: 100%;
height: 50px;
background-color: rgba(255, 255, 255, 0.5);
display: flex;
justify-content: space-around;
align-items: center;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
z-index: 1;
}

header nav ul li a {
font-weight: 500;
font-size: 1.2em;
color: #000;
text-decoration: none;
transition: 300ms;
}

header nav ul li a:hover {
text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

header .logo-title-cont {
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-evenly;
}

header .logo-title-cont .logo img {
height: 200px;
width: 200px;
border-radius: 50%;
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
}

header .logo-title-cont .logo h1 {
text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.5);
}

header .logo-title-cont a .title {
background-color: rgba(254, 100, 208, 0.75);
border-radius: 50px;
padding: 15px;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
animation: floatY 3s ease-in-out infinite;
}

@keyframes floatY {
	0% { transform: translateY(0px); }
	50% { transform: translateY(-5px); }
	100% { transform: translateY(0px); }
}

header .logo-title-cont a {
text-decoration: none;
}

header .logo-title-cont a:hover .title {
background-color: rgba(254, 100, 208, 1);
text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.5);
}

header .logo-title-cont a .title h1 {
color: #fff;
font-size: 2em;
}

main .candel-creator {
background:
    linear-gradient(
      rgb(255, 255, 255),
      rgba(255, 255, 255, 0.3),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.3),
      rgb(255, 255, 255)
    ),
    url("fondo_shop.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

main .candel-creator div {
margin-top: 50px;
}

main .candel-creator div ul {
list-style: none;
display: grid;
grid-template-rows: repeat(2, 100px);
grid-template-columns: repeat(4, 1fr);
justify-items: center;
}

main .candel-creator div ul li button img {
height: 50px;
width: 50px;
border-radius: 50px;
}

</style>
</head>
