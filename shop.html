<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="initial-scale=1, width=device-width"/>
<title>Tienda</title>
<link rel="icon" type="image/x-icon" href="candel_alice_logo.ico">
<style>

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap');

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: "Quicksand", sans-serif;
}

header {
position: relative;
height: 100vh;
overflow: hidden;
}

header::before, header::after, header .layer-3 {
content: "";
position: absolute;
inset: 0;
background-size: cover;
background-position: center;
opacity: 0;
z-index: -1;
animation-duration: 12s;
animation-timing-function: ease-in-out;
animation-iteration-count: infinite;
}

header::before {
background-image: url("fondo_header_1.png");
animation-name: fade1;
}

header::after {
background-image: url("fondo_header_2.png");
animation-name: fade2;
}

header .layer-3 {
background-image: url("fondo_header_3.png");
animation-name: fade3;
}

@keyframes fade1 {
  0%, 33% { opacity: 1; }
  33%, 66% { opacity: 0; }
  66%, 100% { opacity: 1; }
}

@keyframes fade2 {
  0%, 33% { opacity: 0; }
  33%, 66% { opacity: 1; }
  66%, 100% { opacity: 0; }
}

@keyframes fade3 {
  0%, 66% { opacity: 0; }
  66%, 90% { opacity: 1; }
  90%, 100% { opacity: 0; }
}

header nav ul {
list-style: none;
position: fixed;
width: 100%;
height: 50px;
background-color: rgba(255, 255, 255, 0.5);
display: flex;
justify-content: space-around;
align-items: center;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
z-index: 2;
}

header nav ul li a {
font-weight: 500;
font-size: 1.2em;
color: #000;
text-decoration: none;
transition: 300ms;
}

header nav ul li a:hover {
text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

header .logo-title-cont {
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-evenly;
}

header .logo-title-cont .logo img {
height: 200px;
width: 200px;
border-radius: 50%;
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
}

header .logo-title-cont .logo h1 {
text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.5);
}

header .logo-title-cont a .title {
background-color: rgba(254, 100, 208, 0.75);
border-radius: 50px;
padding: 15px;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
animation: floatY 3s ease-in-out infinite;
}

@keyframes floatY {
	0% { transform: translateY(0px); }
	50% { transform: translateY(-5px); }
	100% { transform: translateY(0px); }
}

header .logo-title-cont a {
text-decoration: none;
}

header .logo-title-cont a:hover .title {
background-color: rgba(254, 100, 208, 1);
text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.5);
}

header .logo-title-cont a .title h1 {
color: #fff;
font-size: 2em;
}

main .candel-creator {
position: relative;
background:
    linear-gradient(
      rgb(255, 255, 255),
      rgba(255, 255, 255, 0.3),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.3),
      rgb(255, 255, 255)
    ),
    url("fondo_shop.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

main .candel-creator div h1 {
padding: 10px;
font-size: 24px;
text-shadow: 2px 2px 5px #fff;
}

main .candel-creator div ul {
background: rgba(255, 255, 255, 0.5);
padding: 10px 0px;
box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
list-style: none;
display: grid;
grid-template-rows: repeat(2, 100px);
row-gap: 5px;
grid-template-columns: repeat(4, 1fr);
justify-items: center;
}

main .candel-creator div ul li button {
background: #fff;
cursor: pointer;
padding: 2px;
width: 75px;
border-radius: 5px;
border: none;
box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

main .candel-creator .candel-receptacle ul li .selected {
position: relative;
border: 4px inset lightgreen;
}

main .candel-creator .candel-receptacle ul li .selected::after {
content: '✔';
position: absolute;
color: green;
top: 0;
right: 2px;
}

main .candel-creator .candel-fragrance ul li .selected {
position: relative;
border: 4px inset lightgreen;
}

main .candel-creator .candel-fragrance ul li .selected::after {
content: '✔';
position: absolute;
color: green;
top: 0;
right: 2px;
}

main .candel-creator div ul li button img {
height: 50px;
width: 50px;
border-radius: 50px;
}

main .candel-creator .candel-mod {
overflow-y: scroll;
margin: 0px;
position: sticky;
bottom: 0;
width: 100%;
height: 100px;
background-color: rgba(255, 255, 255, 0.3);
display: flex;
justify-content: space-between;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
z-index: 1;
}

main .candel-creator .candel-mod #candel-show {
display: flex;
gap: 25px;
position: relative;
margin: 0px;
padding-left: 5px;
}

main .candel-creator .candel-mod #candel-show p {
margin: auto;
font-size: 12px;
}
main .candel-creator .candel-mod #candel-show b {
position: absolute;
bottom: 5px;
left: 5px;
font-size: 14px;
}

main .candel-creator .candel-mod #candel-show div b, main .candel-creator .candel-mod #candel-show div p {
left: 0;
position: relative;
font-size: 12px;
}

main .candel-creator .candel-mod .cart-buttons {
margin: 0;
position: absolute;
display: flex;
flex-direction: column;
gap: 5px;
right: 10px;
top: 5px;
}

main .candel-creator .candel-mod .cart-buttons button {
padding: 2px;
border: 1px solid green;
border-radius: 5px;
color: white;
background: lightgreen;
box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
cursor: pointer;
}

main .candel-creator .candel-mod .cart-buttons ion-icon {
height: 20px;
width: 20px;
color: #000;
}

main .candel-creator .candel-mod .cart-buttons p {
font-size: 10px;
color: #000;
}

main .form {
position: relative;
background:
    linear-gradient(
      rgb(255, 255, 255),
      rgba(255, 255, 255, 0.3),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.05),
      rgba(255, 255, 255, 0.3),
      rgb(255, 255, 255)
    ),
    url("fondo_shop_2.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

main .form form {
padding: 60px;
}

main .form form fieldset {
background: rgba(255, 255, 255, 0.7);
margin: auto;
padding: 10px;
width: 300px;
display: flex;
flex-direction: column; 
border: 1px solid #333;
border-radius: 10px;
gap: 2px;
box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
}

main .form form fieldset legend {
font-size: 1.4em;
font-weight: 600;
background: #fff;
border-radius: 5px;
padding: 0px 4px;
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
}

main .form form fieldset label {
font-size: 1.1em;
font-weight: 500;
}

main .form form fieldset input {
border-radius: 5px;
border: 2px solid rgb(254, 100, 208);
background: rgba(255, 255, 255, 0.7);
outline: none;
padding: 2px;
font-size: 1.05em;
}

main .form form fieldset input:focus {
background: #fff;
border: 3px solid rgb(254, 100, 208);
}

main .form form fieldset .authMail {
display: flex;
align-items: baseline;
}

main .form form fieldset .authMail label details {
font-size: 0.7em;
}

main .form form fieldset .authMail label details summary {
list-style: none;
cursor: pointer;
position: relative;
padding-right: 15px;
}

main .form form fieldset .authMail label details summary::-webkit-details-marker {
display: none;
}

main .form form fieldset .authMail label details summary::after {
content: "▶"; 
position: absolute;
right: 0;
transition: transform 300ms;
}

main .form form fieldset .authMail label details[open] summary::after {
transform: rotate(90deg);
}

main .form form fieldset input[type=submit] {
margin: 10px auto;
width: 60px;
height: 40px;
border: 1px solid rgb(255, 150, 200);
border-radius: 10px;
background-color: rgb(254, 100, 208);
box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
font-weight: 500;
cursor: pointer;
transition: 300ms;
}

main .form form fieldset input[type=submit]:hover {
box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);
color: #fff;
border: 1px solid rgb(255, 50, 200);
}

footer {
margin-top: 20px;
background:
    linear-gradient(
      rgb(255, 255, 255),
      rgba(255, 255, 255, 0.05)
    ),
    url("fondo_footer.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

footer nav ul {
list-style: none;
height: 200px;
display: flex;
justify-content: space-evenly;
align-items: center;
}

footer nav ul li {
display: flex;
justify-content: center;
align-items: center;
}

footer nav ul li a {
height: 3em;
width: 3em;
border-radius: 10px;
display: flex;
justify-content: center;
align-items: center;
background: #fff;
padding: 1px;
box-shadow: 1px 1px 5px #000;
}

footer nav ul li a ion-icon {
height: 100%;
width: 100%;
color: blue;
}

footer nav ul li:first-child a {
background: linear-gradient(#F0F, #F00);
}

footer nav ul li:first-child a ion-icon {
color: #fff;
}

footer nav ul li:last-child a {
padding: 2px;
background: #000;
}

footer nav ul li:last-child a ion-icon {
color: #fff;
}


</style>
</head>
<body>

<header>
	<nav>

			<li><a href="index.html">Inicio</a></li>

			<li><a href="about.html">Descúbrenos</a></li>
			<li><a href="contact.html">Contacto</a></li>

	<div class="logo-title-cont">

		<div class="candel-receptacle">

			<h1>Selecciona tu envase (máximo 1)</h1>

			<ul>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Rectangulo 100ml</p></button></li>
				<li><button><img src="candel_alice_logo.jpg" alt=""/><p>Cuadrado 100ml</p></button></li>

<footer>
	<nav>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {

    let order = {};
    let totalFinalPrice = 0;

    const receptacleButtons = document.querySelectorAll(".candel-receptacle button");
    const fragranceButtons = document.querySelectorAll(".candel-fragrance button");

    const MAX_SELECTED = 3;

    // Estado
    let selectedReceptacle = null;
    let selectedFragrances = [];

    // Precios de ejemplo
    const receptaclePrices = {
        "Rectangulo 100ml": 12.5,
        "Cuadrado 100ml": 12.0,
        "Circulo 100ml": 11.5,
        "Cilindro 100ml": 11.0,
        "Rectangulo 200ml": 16.0,
        "Cuadrado 200ml": 15.5,
        "Circulo 200ml": 15.0,
        "Cilindro 200ml": 14.5
    };

    const fragrancePrices = {
        "Árbol de pino": 2.5,
        "Lima fresca": 2.0,
        "Mango Algarroba": 3.0,
        "Frutos rojos": 2.5,
        "Menta polar": 2.0,
        "Cedro y ámbar": 3.0,
        "Aceite de romero": 2.5,
        "Árbol de te verde": 2.5
    };

    const showContainer = document.getElementById("candel-show");

    const showFullOrder = document.getElementById("finalOrderList");

    const orderForm = document.getElementById("orderForm");

    // Recipientes (selección única)
    receptacleButtons.forEach(button => {
        button.addEventListener("click", () => {
            receptacleButtons.forEach(b => b.classList.remove("selected"));
            button.classList.add("selected");

            const text = button.querySelector("p").textContent.trim();

            selectedReceptacle = {
                name: text,
                price: receptaclePrices[text] || 0
            };

            buildOrderObject();
        });
    });

    // Fragancias (máx. 3)
    fragranceButtons.forEach(button => {
        button.addEventListener("click", () => {
            const text = button.querySelector("p").textContent.trim();

            if (button.classList.contains("selected")) {
                button.classList.remove("selected");
                selectedFragrances = selectedFragrances.filter(
                    f => f.name !== text
                );
                buildOrderObject();
                return;
            }

            if (selectedFragrances.length >= MAX_SELECTED) {
                return;
            }

            button.classList.add("selected");
            selectedFragrances.push({
                name: text,
                price: fragrancePrices[text] || 0
            });

            buildOrderObject();
        });
    });

    // Construcción del objeto final y actualización visual
    function buildOrderObject() {
        if (!selectedReceptacle) {
            showContainer.innerHTML = "<p>Selecciona un recipiente para comenzar</p>";
            return;
        }

        const total =
            selectedReceptacle.price +
            selectedFragrances.reduce((sum, f) => sum + f.price, 0);

        order = {
            receptacle: selectedReceptacle,
            fragrances: selectedFragrances,
            total: Number(total.toFixed(2))
        };

        // Mostrar en el contenedor
        renderOrder(order);
        console.log("Pedido actual:", order);
    }

    function renderOrder(order) {
        let html = `<div><b>Recipiente</b><p>${order.receptacle.name}: </p><p style="text-align: center;">${order.receptacle.price.toFixed(2)}€</p></div>`;

        html += `<div><b>Fragancias</b>`;
        if (order.fragrances.length === 0) {
            html += `<p>Selecciona fragancias</p>`;
        } else {
            order.fragrances.forEach(f => {
                html += `<p>${f.name}: ${f.price.toFixed(2)}€</p>`;
            });
        }

        html += `</div>`;

        html += `<b>Total: ${order.total.toFixed(2)}€</b>`;

        showContainer.innerHTML = html;
    }

    document.getElementById('addCartBtn').addEventListener('click', () => {

	if (Object.keys(order).length === 0) {
	    showContainer.innerHTML = `<p>No hay nada seleccionado</p>`;

	} else {	    
	    showContainer.innerHTML = `<p>Añadido al pedido, pulse "<i>Pedido</i>" para ver</p>`;

	    const ulFinalOrder = document.createElement("ul");
	    const liFinalOrder = document.createElement("li");

	    const pFinalOrderReceptacle = document.createElement("p");
            pFinalOrderReceptacle.appendChild(document.createTextNode(`${order.receptacle.name}`));
	    liFinalOrder.appendChild(pFinalOrderReceptacle);

	   if (order.fragrances.length === 0) {
	     	const pFinalOrderEmptyFragrances = document.createElement("p");
 		pFinalOrderEmptyFragrances.appendChild(document.createTextNode(`Sin fragancia`));
		liFinalOrder.appendChild(pFinalOrderEmptyFragrances);
	   } else {
		order.fragrances.forEach(f => {
		    const pFinalOrderFragrances = document.createElement("p");
		    pFinalOrderFragrances.appendChild(document.createTextNode(`${f.name}`));
	  	    liFinalOrder.appendChild(pFinalOrderFragrances);
		});        
	    }

	    const pFinalOrderPrice = document.createElement("p");
	    pFinalOrderPrice.appendChild(document.createTextNode(`${order.total}`));
	    liFinalOrder.appendChild(pFinalOrderPrice);

	    totalFinalPrice += order.total;
	    
	    document.getElementById('pTotalFinalPrice').innerHTML = `Precio Total ${totalFinalPrice}`;

	    ulFinalOrder.appendChild(liFinalOrder);

	    showFullOrder.appendChild(ulFinalOrder);

	    console.log("Pedido en lista");

	    order = {};

	    selectedReceptacle = null;
            receptacleButtons.forEach(button => {
		button.classList.remove("selected");
	    });

	    selectedFragrances = [];
	    fragranceButtons.forEach(button => {
	    	button.classList.remove("selected");
	    });

	}

    });

    emailjs.init("LYgAhJcHm4r_HT98I");

    orderForm.addEventListener("submit", e => {
	e.preventDefault();
	
        // ====== Datos simples del formulario ======
        const completeName = document.getElementById("completeName").value;
    	const address = document.getElementById("address").value;
    	const postalCode = document.getElementById("postalCode").value;
    	const mail = document.getElementById("mail").value;
        const phone = document.getElementById("phone").value;

	// ======= Lista de productos ======
	const items = document.querySelectorAll("#finalOrderList ul li");

        const itemsHtml = `
          <ul>
            ${[...items].map(li => `
              <li>${li.textContent.trim()}</li>
            `).join("")}
          </ul>
        `;
         // ====== Precio total ======
         const totalPrice = document.getElementById("pTotalFinalPrice").textContent.trim();	
	// ====== Enviar a EmailJS ======
        emailjs.send("service_kupzspd", "template_fnvhcaa", {
            complete_name: completeName,
            address: address,
            postal_code: postalCode,
            email: mail,
            phone: phone,
            order_items: itemsHtml,
            total_price: totalPrice
        })
        .then(() => {
          alert("Pedido enviado correctamente");
          document.getElementById("orderForm").reset();
        })
        .catch(error => {
          console.error("Error:", error);
          alert("Error al enviar el pedido");
        });

	orderForm.reset();
	document.getElementById('pTotalFinalPrice').innerHTML = "";
	showFullOrder.querySelectorAll("ul").forEach(ul => ul.remove());
	totalFinalPrice = 0;
    });

    document.getElementById("goToOrder").addEventListener("click", () => {
	orderForm.scrollIntoView({
	    behavior: "smooth"
	});
    });

});

</script>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
