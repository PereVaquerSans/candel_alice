<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="initial-scale=1, width-device=width"/>
<title>Descúbrenos</title>
<link rel="icon" type="image/x-icon" href="candel_alice_logo.ico">
<style>

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap');

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: "Quicksand", sans-serif;
}

header {
position: relative;
height: 100vh;
overflow: hidden;
}

header::before, header::after, header .layer-3 {
content: "";
position: absolute;
inset: 0;
background-size: cover;
background-position: center;
opacity: 0;
z-index: -1;
animation-duration: 12s;
animation-timing-function: ease-in-out;
animation-iteration-count: infinite;
}

header::before {
background-image: url("fondo_header_1.png");
animation-name: fade1;
}

header::after {
background-image: url("fondo_header_2.png");
animation-name: fade2;
}

header .layer-3 {
background-image: url("fondo_header_3.png");
animation-name: fade3;
}

@keyframes fade1 {
  0%, 33% { opacity: 1; }
  33%, 66% { opacity: 0; }
  66%, 100% { opacity: 1; }
}

@keyframes fade2 {
  0%, 33% { opacity: 0; }
  33%, 66% { opacity: 1; }
  66%, 100% { opacity: 0; }
}

@keyframes fade3 {
  0%, 66% { opacity: 0; }
  66%, 90% { opacity: 1; }
  90%, 100% { opacity: 0; }
}

header nav ul {
list-style: none;
position: fixed;
width: 100%;
height: 50px;
background-color: rgba(255, 255, 255, 0.5);
display: flex;
justify-content: space-around;
align-items: center;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
z-index: 1;
}

header nav ul li a {
font-weight: 500;
font-size: 1.2em;
color: #000;
text-decoration: none;
transition: 300ms;
}

header nav ul li a:hover {
text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

header .logo-title-cont {
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-evenly;
}

header .logo-title-cont .logo img {
height: 200px;
width: 200px;
border-radius: 50%;
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
}

header .logo-title-cont .logo h1 {
text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.5);
}

header .logo-title-cont a .title {
background-color: rgba(254, 100, 208, 0.75);
border-radius: 50px;
padding: 15px;
backdrop-filter: blur(5px);
box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
animation: floatY 3s ease-in-out infinite;
}

@keyframes floatY {
	0% { transform: translateY(0px); }
	50% { transform: translateY(-5px); }
	100% { transform: translateY(0px); }
}

header .logo-title-cont a {
text-decoration: none;
}

header .logo-title-cont a:hover .title {
background-color: rgba(254, 100, 208, 1);
text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.5);
}

header .logo-title-cont a .title h1 {
color: #fff;
font-size: 2em;
}

</style>
</head>
<body>

<header>
	<nav>
		<ul>
			<li><a href="index.html">Inicio</a></li>
			<li><a href="shop.html">Tienda</a></li>
			<li><a href="products.html">Productos</a></li>
			<li><a href="contact.html">Contacto</a></li>
		</ul>
	</nav>
	
	<div class="logo-title-cont">

		<div class="logo">
			<img src="candel_alice_logo.jpg"/>
			<h1>Candel_Alice</h1>
		</div>

		<a href="shop.html">
			<div class="title">
				<h1>REALIZAR PEDIDO</h1>
			</div>
		</a>

	</div>

	<div class="layer-3"></div>


</header>

<main></main>

</body>
</html>
